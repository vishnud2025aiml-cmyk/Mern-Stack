<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log('Hello')
        console.log('Welcome')

        //keywords and variables
        //var,let,const

        //var
        //declaration   var age;
        //initialization    age=20;
        var age=20;
        
        //re-initialization
        age=30;
        //re-declaration
        var age=40;
        console.log("age: ",age);

        //let
        let course="Mern";
        course="dsa"
        //cannot re-declaration        let course="dsa";
        console.log('course: ',course);

        //const
        const pan="SFEINV23455";
        // cannot re-initialization and re-declaration       pan="DGHBESF342";  const pan;
        console.log("pan: ",pan);


        let username='admin'
        let password=123456
        if(username=='admin' && password==123456){
            console.log('login success')
        }else{
            console.log('login failed')
        }

        
        //function
        function student(name,clg='sece'){
            console.log(`Hello ${name} welcome to ${clg} college`);
        }
        student('ragul')
        student('kumar')
        student('vishnu')

        //Employee
        function Employee(Name,empid,comp='Microsoft'){
            console.log(`Employee Name: ${Name} Employee Id: ${empid} Company: ${comp}`);
        }
        Employee('vishnu',1)
        Employee('Raj',2)
        Employee('Ragu',3)


        //function in datatype
        let data1=function(){
            return 'Hello Employee'
        }
        console.log(data1());

        //arrow function
        let mult1=()=>{
            return 'Arrow function'
        }
        console.log(mult1())

        //arrow function with parameters
        let mult=(a,b)=>{
            return a*b
        }
        console.log(mult(2,4))

        //in function passing the another function as an argument
        function sece(callback){
            console.log('Welcome to sece');
            callback()
        }
        function stud(){
            console.log('Students!')
        }
        sece(stud)

        //example
        function whatsapp(callback){
            console.log('Welcome to Whatsapp');
            callback()
        }
        function notification(){
            console.log('Notification!');
        }
        whatsapp(notification)


        //promise
        //resolve,reject fullfilled
        let fetch_api=new Promise((resolve,reject)=>{
            let api=true;
            if(api){
            resolve('fetched api')
        }else{
            setTimeout(()=>{
                reject('failed to fetch api data')
            },2000)
        }
            
        })
        console.log(fetch_api)

        // ======Object======

        let emp={
            emp_id:100,
            emp_name:"Vishnu",
            salary:900000
        }

        console.log(emp);

        // Dot Notation
        console.log(emp.emp_name);

        //Square Brackets
        console.log(emp["salary"]);
        
        let emp2=[
            {
                emp_id:100,
                emp_name:"vishnu",
                salary:900000,
                skills:["python","java","sql"]
            },
            {
                emp_id:101,
                emp_name:"gokul",
                salary:60000,
                company:{
                    c1:"tcs",c2:"accenture"
                }
            }
        ]

        console.log(emp2[0].skills[1]);

        console.log(emp2[1].company.c2);

        // object ot stiring
        // let stringify_data = JSON.stringify(emp2);
        // console.log(stringify_data);

        // string to object
        // let parsed_data=JSON.parse(stringify_data);
        // console.log(parsed_data);

        // let copied_data=emp2;
        

        // Shallow copy(spread operator)
        // let copied_data={...emp2};

        // copied_data.salary=80000;

        // copied_data[1].company.c1="Philips";

        // Deep copy

        let copied_data=JSON.parse(JSON.stringify(emp2));
        copied_data[1].company.c1="Philips";

        console.log("Original data ",emp2);
        console.log("Copied data ",copied_data);


    </script>
    
</body>

</html>
